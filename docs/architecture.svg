<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">Campus Policy Assistant architecture</title><desc id="desc">Questions use an exact source-version-aware cache or raw, HyDE and fusion retrieval. Only approved source versions can reach the answer model. Synthetic search keys do not enter answer prompts. Index updates are staged and committed with locks.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a9b7d4"/></marker></defs>
<rect width="1000" height="600" fill="#10141e"/><g font-family="sans-serif" fill="#edf1fa" text-anchor="middle"><text x="500" y="35" font-size="22">Campus Policy Discovery Assistant</text>
<g fill="#1b2231" stroke="#69799a"><rect x="30" y="80" width="190" height="70" rx="9"/><rect x="290" y="80" width="220" height="70" rx="9"/><rect x="590" y="80" width="340" height="70" rx="9"/><rect x="290" y="220" width="220" height="85" rx="9"/><rect x="590" y="220" width="340" height="85" rx="9"/><rect x="590" y="375" width="340" height="85" rx="9"/><rect x="290" y="375" width="220" height="85" rx="9"/><rect x="30" y="375" width="190" height="85" rx="9"/></g>
<text x="125" y="110">Question + mode</text><text x="125" y="132" font-size="13">FastAPI / dashboard</text><text x="400" y="110">Exact answer cache</text><text x="400" y="132" font-size="13">Revalidate cited source versions</text><text x="760" y="110">Raw / HyDE / fusion search</text><text x="760" y="132" font-size="13">Generated key: search only, never evidence</text><text x="400" y="250">Source registry</text><text x="400" y="274" font-size="13">Explicit approval + current hash</text><text x="760" y="250">Approved Chroma source chunks</text><text x="760" y="274" font-size="13">Exclude pending, decoy and synthetic sources</text><text x="760" y="407">Cosine confidence gate</text><text x="760" y="433" font-size="13">RRF ranks only; low confidence abstains</text><text x="400" y="407">Grounded answer LLM</text><text x="400" y="433" font-size="13">Question + real source excerpts only</text><text x="125" y="407">Citation check</text><text x="125" y="433" font-size="13">Answer / abstain + trace</text>
<g stroke="#a9b7d4" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M220 115H290"/><path d="M510 115H590"/><path d="M760 150V220"/><path d="M510 262H590"/><path d="M760 305V375"/><path d="M590 417H510"/><path d="M290 417H220"/></g>
<text x="500" y="525" font-size="15">Files → hash diff → stage extraction + embeddings → locked replacement / rollback</text><text x="500" y="552" font-size="13" fill="#a8b5cb">Atomic manifests · dependent cache invalidation · real accuracy pending actual PDFs and verified labels</text></g></svg>
